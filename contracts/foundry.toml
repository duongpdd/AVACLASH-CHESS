[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = false

[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
